<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=300, initial-scale=1.0" />
    <title>Fitbit Versa 2 Simulator Harness</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 300px;
        height: 300px;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
      }
      #watch-screen {
        position: relative;
        width: 300px;
        height: 300px;
        background: #000000;
        overflow: hidden;
      }
      .watch-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 28px;
        z-index: 10;
        background: #111827;
        border-bottom: 2px solid #1f2937;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #status {
        font-size: 14px;
        font-weight: 600;
        color: #e5e7eb;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      #page-hint {
        font-size: 13px;
        font-weight: 600;
        color: #60a5fa;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .watch-panorama {
        position: relative;
        width: 300px;
        height: 300px;
        overflow: hidden;
      }
      .watch-view {
        width: 300px;
        height: 300px;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
      }
      .watch-view::-webkit-scrollbar {
        display: none;
      }
      .watch-sync-tile {
        height: 80px;
        width: 300px;
        background: #000000;
        padding: 32px 12px 6px;
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .watch-sync-pill {
        width: 100%;
        height: 42px;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-size: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .watch-spacer-tile {
        height: 28px;
        width: 300px;
        background: #000000;
      }
      .watch-category-header {
        height: 32px;
        width: 300px;
        background: #0f172a;
        border-bottom: 2px solid #1f2937;
        padding: 0 14px;
        display: flex;
        align-items: center;
        font-size: 16px;
        font-weight: 600;
        color: #60a5fa;
        user-select: none;
      }
      .watch-task-tile {
        height: 56px;
        width: 300px;
        background: #000000;
        border-bottom: 2px solid #1f2937;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .watch-task-summary {
        font-size: 25px;
        font-weight: 500;
        line-height: 1.15;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      .watch-task-tile[data-checked="1"] .watch-task-summary {
        color: #9ca3af;
        text-decoration: line-through;
      }
      .watch-list-tile {
        height: 68px;
        width: 300px;
        background: #000000;
        border-bottom: 2px solid #1f2937;
        padding: 6px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .watch-list-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
      }
      .watch-list-title {
        font-size: 25px;
        font-weight: 500;
        line-height: 1.15;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .watch-list-subtitle {
        font-size: 15px;
        line-height: 1.25;
        color: #60a5fa;
        margin-top: 2px;
      }
      .watch-chevron {
        color: #6b7280;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }
      .watch-checkbox-box {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 2px solid #6b7280;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .watch-task-tile[data-checked="1"] .watch-checkbox-box {
        background: #22c55e;
        border-color: #22c55e;
      }
    </style>
  </head>
  <body>
    <div id="watch-screen" data-testid="watch-screen"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
