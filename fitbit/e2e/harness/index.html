<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=300, initial-scale=1.0" />
    <title>Fitbit Versa 2 Simulator Harness</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 300px;
        height: 300px;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
      }
      #watch-screen {
        width: 300px;
        height: 300px;
        background: #000000;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .watch-header {
        height: 40px;
        flex-shrink: 0;
        background: #111827;
        border-bottom: 2px solid #1f2937;
        padding: 0 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      #back-btn {
        background: #374151;
        color: #ffffff;
        border: 0;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      #status {
        font-size: 15px;
        font-weight: 600;
        color: #e5e7eb;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      #sync-btn {
        background: #2563eb;
        color: #ffffff;
        border: 0;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      .watch-view {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .watch-tile {
        height: 58px;
        width: 300px;
        background: #000000;
        border-bottom: 2px solid #1f2937;
        padding: 6px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }
      .watch-tile-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
      }
      .watch-summary {
        font-size: 20px;
        line-height: 1.2;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .watch-tile[data-checked="1"] .watch-summary {
        color: #9ca3af;
        text-decoration: line-through;
      }
      .watch-category {
        font-size: 13px;
        line-height: 1.25;
        color: #60a5fa;
        margin-top: 2px;
      }
      .watch-chevron {
        color: #6b7280;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }
      .watch-checkbox-box {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        border: 2px solid #6b7280;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .watch-tile[data-checked="1"] .watch-checkbox-box {
        background: #22c55e;
        border-color: #22c55e;
      }
    </style>
  </head>
  <body>
    <div id="watch-screen" data-testid="watch-screen"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
